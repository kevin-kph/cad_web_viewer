<html>
  <head>
    <title>Mesh Replace Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />

    <style type="text/css">
      table td {
        vertical-align: top;
      }

      body {
        padding: 10px;
      }

      p {
        font-family: sans-serif;
        font-size: 1.5em;
      }
    </style>
    <script type="importmap">

        "imports": {

      }

    <script type="module" crossorigin src="/scripts/examples/mesh_replace.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">

      <tr>
