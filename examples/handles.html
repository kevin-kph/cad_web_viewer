<html>
  <head>
    <title>Custom Handles Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/handles.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/index.js">
    <link rel="modulepreload" crossorigin href="/scripts/utils.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>

  <body>
    <table>
      <tr>
        <td>
          <div id="viewerContainer" class="example-canvas"></div>
        </td>
      </tr>
    </table>
    <table>
      <tr>
        <td>
          <label for="axis-translation-color">Translation Handle Color: </label>
          <input id="axis-translation-color" type="color" value="#FF0000" />
          <input type="button" id="axis-translation" value="Add Axis Translation Handles" />
        </td>
      </tr>
      <tr>
        <td>
          <label for="axis-rotation-color">Rotation Handle Color: </label>
          <input id="axis-rotation-color" type="color" value="#FF0000" />
          <input type="button" id="axis-rotation" value="Add Axis Rotation Handles" />
        </td>
      </tr>
      <tr>
        <td>
          <input type="button" id="default-handles" value="Add Default Handles" />
          <input type="button" id="reset-model" value="Reset Model" />
        </td>
      </tr>
      <tr>
        <td>
          Select a face or straight edge. Insert a translation or rotation handle oriented along the
          face normal or edge direction.
        </td>
      </tr>
    </table>

  </body>
</html>
