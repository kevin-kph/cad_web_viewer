<html>
  <head>
    <title>Level Of Detail Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />

    <style type="text/css">
      table td {
        vertical-align: top;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/level_of_detail.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/index.js">
    <link rel="modulepreload" crossorigin href="/scripts/modelTree.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>
  <body>
    <table>
      <tr>
        <td>
          <div id="modelTree"></div>
        </td>
        <td>
          <div id="viewerContainer" class="example-canvas-small"></div>
        </td>
      </tr>
      <tr>
        <td></td>
        <td>
          <div class="example-div-block">
            <div>
              <label> Select something in the 3D scene or in the model tree on the left.</label>
            </div>
            <div>
              <label> Then Click to switch Level Of Detail:</label>
              <button id="LOD0">Normal</button>
              <button id="LOD1">Low</button>
              <button id="LOD2">ExtraLow</button>
            </div>
          </div>
        </td>
      </tr>
    </table>

  </body>
</html>
