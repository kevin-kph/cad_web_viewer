<html>
  <head>
    <title>Cutting Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />

    <style type="text/css">
      .cuttingSectionBox {
        padding: 5px;
      }

      .planeParam {
        width: 50px;
      }

      .section {
        margin: 0px 5px;
      }

      #cuttingSections td {
        vertical-align: top;
        border: 1px solid gray;
      }

      #log {
        width: 450px;
        height: 125px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/cutting.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/index.js">
    <link rel="modulepreload" crossorigin href="/scripts/utils.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>
  <body>
    <div id="viewerContainer" class="example-canvas-small"></div>
    <table id="cuttingSections" class="section"></table>
    <div class="section">
      <div>
        <label for="enableSelection">Enable Stand-in Geometry Selection</label>
        <input type="checkbox" id="enableSelection" checked />
      </div>
      <div>
        <label for="enableCapping">Enable Capping Geometry</label>
        <input id="enableCapping" type="checkbox" checked />
      </div>
      <div>
        <label for="cappingFaceColor">Capping Geometry Face Color: </label>
        <input id="cappingFaceColor" type="color" value="#7F7F7F" />
        <label for="cappingLineColor">Capping Geometry Edge Color: </label>
        <input id="cappingLineColor" type="color" value="#7F7F7F" />
      </div>
    </div>

  </body>
</html>
