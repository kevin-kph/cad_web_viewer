<html>
  <head>
    <title>Snapshot Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />

    <style type="text/css">
      td {
        vertical-align: top;
        padding: 10px;
      }

      #logText {
        width: 400px;
        height: 300px;
      }

      .viewBox {
        display: inline-block;
        margin: 5px;
        border: 1px solid gray;
        padding: 3px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/snapshot.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/index.js">
    <link rel="modulepreload" crossorigin href="/scripts/viewOrientationBar.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>
  <body>
    <h3>Snaptshot Example</h3>
    <table>
      <tr>
        <td>
          <div id="operatorPanel"></div>
          <div id="viewPanel"></div>
        </td>
        <td>
          <div id="exampleContainer" class="example-canvas-small"></div>
          <div id="viewOrientationBar" class="example-div-block"></div>
        </td>
      </tr>
    </table>
    <p>
      Click the button below to create a snapshot for the current camera view. Click on the
      snapshots to return to that view.
    </p>
    <p>Snapshots: <button id="createViewButton">Create</button></p>
    <div id="views"></div>

  </body>
</html>
