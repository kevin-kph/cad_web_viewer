<html>
  <head>
    <title>Operator Modifier Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />

    <style type="text/css">
      body {
        margin: 20px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/operator_modifier.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/index.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>
  <body>
    <div id="viewerContainer" class="example-canvas-small"></div>

    <div id="operators">
      <div class="operatorMapping" id="orbit">
        <strong>Orbit Mouse Button: </strong>
        <select class="buttonSelect button" id="orbit-button">
          <option value="-1">None</option>
          <option value="0" selected="selected">Left</option>
          <option value="1">Middle</option>
          <option value="2">Right</option>
        </select>
        <strong>Modifier key: </strong>
        <select class="modifierKeySelect" id="orbit-modifier">
          <option value="0">None</option>
          <option value="2">Shift</option>
          <option value="4">Alt</option>
          <option value="8">Control</option>
        </select>
      </div>
      <div class="operatorMapping" id="pan">
        <strong>Pan Mouse Button: </strong>
        <select class="buttonSelect" id="pan-button">
          <option value="-1">None</option>
          <option value="0">Left</option>
          <option value="1">Middle</option>
          <option value="2" selected="selected">Right</option>
        </select>
        <strong>Modifier key: </strong>
        <select class="modifierKeySelect" id="pan-modifier">
          <option value="0">None</option>
          <option value="2">Shift</option>
          <option value="4">Alt</option>
          <option value="8">Control</option>
        </select>
      </div>
      <div class="operatorMapping" id="zoom">
        <strong>Zoom Mouse Button: </strong>
        <select class="buttonSelect" id="zoom-button">
          <option value="-1">None</option>
          <option value="0">Left</option>
          <option value="1" selected="selected">Middle</option>
          <option value="2">Right</option>
        </select>
        <strong>Modifier key: </strong>
        <select class="modifierKeySelect" id="zoom-modifier">
          <option value="0">None</option>
          <option value="2">Shift</option>
          <option value="4">Alt</option>
          <option value="8">Control</option>
        </select>
      </div>
    </div>

  </body>
</html>
