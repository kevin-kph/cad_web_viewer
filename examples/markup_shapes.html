<html>
  <head>
    <title>Markup Shapes Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />

    <style type="text/css">
      body {
        padding: 10px;
      }
      .group {
        margin-bottom: 16px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/markup_shapes.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/index.js">
    <link rel="modulepreload" crossorigin href="/scripts/utils.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>

  <body>
    <table>
      <tr>
        <td>
          <div id="viewerContainer" class="example-canvas-small"></div>
        </td>
        <td style="vertical-align: top">
          <div>Select Markup Shape Operator:</div>
          <select id="customOperatorSelect" size="5">
            <option value="ArrowOperator" selected>Arrow Operator</option>
            <option value="TextBoxOperator">Text Box Operator</option>
          </select>
        </td>
      </tr>
    </table>

    <div id="ArrowOperatorOptions">
      <h4>Arrow Operator</h4>
      <div>Hold down the shift key and drag arrows onto the canvas</div>
      <div class="group">
        <label for="arrowLineType">Arrow Type: </label>
        <select id="arrowLineType">
          <option value="Line">Line</option>
          <option value="Polyline">Polyline</option>
        </select>
      </div>

      <div class="group">
        <div>
          <label for="arrowStartEndcap">Start Endcap Type: </label>
          <select id="arrowStartEndcap">
            <option value="None">None</option>
            <option value="Arrowhead">Arrowhead</option>
            <option value="Circle">Circle</option>
          </select>
        </div>
        <div>
          <label for="arrowStartEndcapColor">Start Endcap Color: </label>
          <input type="color" id="arrowStartEndcapColor" value="#000000" />
        </div>
        <div>
          <label for="arrowStartEndcapSize">Start Endcap Size: </label>
          <input type="number" id="arrowStartEndcapSize" step="1" value="9" />
        </div>
      </div>

      <div class="group">
        <div>
          <label for="arrowEndEndcap">End Endcap Type: </label>
          <select id="arrowEndEndcap">
            <option value="None">None</option>
            <option value="Arrowhead" selected>Arrowhead</option>
            <option value="Circle">Circle</option>
          </select>
        </div>
        <div>
          <label for="arrowEndEndcapColor">End Endcap Color: </label>
          <input type="color" id="arrowEndEndcapColor" value="#000000" />
        </div>
        <div>
          <label for="arrowEndEndcapSize">End Endcap Size: </label>
          <input type="number" id="arrowEndEndcapSize" step="1" value="9" />
        </div>
      </div>

      <div class="group">
        <div>
          <label for="arrowStrokeWidth">Stroke Width: </label>
          <input type="number" id="arrowStrokeWidth" step="1" value="1" />
        </div>
        <div>
          <label for="arrowStrokeColor">Stroke Color: </label>
          <input type="color" id="arrowStrokeColor" value="#000000" />
        </div>
        <div>
          <label for="arrowEndcapsInverted">Endcaps Inverted: </label>
          <input type="checkbox" id="arrowEndcapsInverted" />
        </div>
      </div>
    </div>

    <div id="TextBoxOperatorOptions" style="display: none">
      <h4>Text Box Operator</h4>
      <div>
        Hold down the shift key and click the canvas to place a text box with the current settings.
      </div>
      <div class="group">
        <div>
          <label for="textBoxDefaultText">Default Text:</label>
          <input id="textBoxDefaultText" type="text" value="HOOPS Visualize Web" />
        </div>
        <div>
          <label for="textBoxPadding">Padding: </label>
          <input type="number" id="textBoxPadding" min="0" step="1" value="5" />
        </div>
      </div>
      <div class="group">
        <div>
          <label for="textBoxTextColor">Text Color: </label>
          <input type="color" id="textBoxTextColor" value="#000000" />
        </div>
        <div>
          <label for="textBoxTextSize">Text Size: </label>
          <input type="number" id="textBoxTextSize" step="1" value="12" />
        </div>
      </div>
      <div class="group">
        <div>
          <label for="textBoxBackgroundOpacity">Background Opacity: </label>
          <input type="number" id="textBoxBackgroundOpacity" min="0" max="1" step="0.1" value="0" />
        </div>
        <div>
          <label for="textBoxBackgroundColor">Background Color: </label>
          <input type="color" id="textBoxBackgroundColor" value="#FFFFFF" />
        </div>
        <div>
          <label for="textBoxBorderWidth">Border Width: </label>
          <input type="number" id="textBoxBorderWidth" min="0" step="1" value="1" />
        </div>
        <div>
          <label for="textBoxBorderRadius">Border Radius: </label>
          <input type="number" id="textBoxBorderRadius" min="0" step="1" value="0" />
        </div>
      </div>
    </div>

  </body>
</html>
