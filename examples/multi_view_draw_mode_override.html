<html>
  <head>
    <title>Multiple Views With Draw Mode Override Example</title>


    <style type="text/css">
      body {
        padding: 10px;
      }

      .hwv-view {
        position: relative;
        padding: 3px;
        margin: 5px;
        width: 325px;
        height: 325px;
        border: 1px solid black;
      }

      #viewers {
        display: flex;
        flex-wrap: wrap;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/multi_view_draw_mode_override.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/multiView.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>
  <body>
    <div id="viewers">
      <div>
        <button id="cycle-draw-mode-view-0" disabled>Cycle Draw Mode (View 0)</button>
        <div id="view-0" class="hwv-view"></div>
      </div>
      <div>
        <button id="cycle-draw-mode-view-1" disabled>Cycle Draw Mode (View 1)</button>
        <div id="view-1" class="hwv-view"></div>
      </div>
    </div>

  </body>
</html>
