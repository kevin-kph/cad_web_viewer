<html>
  <head>
    <title>Background and Anti-Aliasing Example</title>

    <link rel="icon" type="image/svg" href="/images/hcfavicon.svg" />

    <style type="text/css">
      #viewerContainer {
        background: url('images/background/logo.png');
        background-size: 160px 160px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@ts3d-hoops/web-viewer": "./hoops-web-viewer.mjs"
        }
      }
    </script>

    
    <script type="module" crossorigin src="/scripts/examples/background.js"></script>
    <link rel="modulepreload" crossorigin href="/scripts/WebViewer.js">
    <link rel="modulepreload" crossorigin href="/scripts/index.js">
    <link rel="modulepreload" crossorigin href="/scripts/utils.js">
    <link rel="stylesheet" crossorigin href="/styles/styles.css">
  </head>
  <body>
    <table>
      <tr>
        <td>
          <div id="viewerContainer" class="example-canvas-small"></div>
        </td>
      </tr>
    </table>
    <table>
      <tr>
        <td>
          <b>Anti-Aliasing</b>
        </td>
      </tr>
      <tr>
        <td>
          <input type="checkbox" id="anti_aliasing" checked="checked" />
          <label for="anti_aliasing">Anti Aliasing</label>
        </td>
      </tr>
      <tr>
        <td>
          <b>Background Color</b>
        </td>
      </tr>
      <tr>
        <td>
          <label for="background_color_top">Background Color Top: </label>
          <input id="background_color_top" type="color" value="#FFFFFF" />
          <input type="button" id="set_color_top" value="set top color" />
          <input type="button" id="set_color_transparent_top" value="set top color transparent" />
        </td>
      </tr>
      <tr>
        <td>
          <label for="background_color_bottom">Background Color Bottom: </label>
          <input id="background_color_bottom" type="color" value="#FFFFFF" />
          <input type="button" id="set_color_bottom" value="set bottom color" />
          <input
            type="button"
            id="set_color_transparent_bottom"
            value="set bottom color transparent"
          />
        </td>
      </tr>
    </table>

  </body>
</html>
